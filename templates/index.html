<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>JARVIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="bootGate" class="gate">
    <canvas id="orbPreview" width="420" height="420" aria-hidden="true"></canvas>
    <p class="gate-brand">J.A.R.V.I.S.</p>
    <p class="gate-hint">Sesli ve görüntülü görüşme</p>
    <button type="button" id="bootBtn" class="gate-btn">ARA</button>
  </div>

  <main class="call" id="callUi" hidden>
    <video id="userCam" playsinline autoplay muted></video>
    <div class="orb-stage">
      <canvas id="orb" width="720" height="720" aria-label="Jarvis"></canvas>
      <p class="brand">J.A.R.V.I.S.</p>
      <p class="state" id="stateLine">Bağlanıyor…</p>
    </div>

    <div class="subs" id="subs" aria-live="polite"></div>

    <div class="call-bar">
      <button type="button" id="muteBtn" class="round" aria-pressed="false">Ses</button>
      <button type="button" id="camBtn" class="round" aria-pressed="true">Kamera</button>
      <button type="button" id="endBtn" class="round end">Bitir</button>
    </div>
  </main>

  <script src="/static/orb.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
