<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#02040a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>JARVIS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=46" />
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <div id="bootGate" class="gate">
    <canvas id="orbPreview" width="420" height="420" aria-hidden="true"></canvas>
    <p class="gate-brand">J.A.R.V.I.S.</p>
    <p class="gate-hint">dokun — dinliyorum</p>
    <div class="gate-status" id="gateStatus">Sistemler yoklanıyor…</div>
  </div>
  <main class="call" id="callUi" hidden>
    <header class="hud">
      <span id="hudClock">--:--</span>
      <span id="hudBrain">—</span>
      <span id="hudLearn">öğrenme</span>
    </header>
    <video id="userCam" playsinline autoplay muted></video>
    <div class="workspace">
      <section class="orb-stage">
        <div class="orb-frame">
          <canvas id="orb" width="720" height="720" aria-label="Jarvis"></canvas>
        </div>
        <p class="brand">J.A.R.V.I.S.</p>
        <p class="state" id="stateLine">Dinliyor</p>
      </section>
      <aside class="panel" id="sidePanel">
        <div class="subs" id="subs" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <div class="chat-log" id="chatLog"></div>
        <form id="chatForm" class="chat-form" autocomplete="off">
          <input id="chatInput" type="text" maxlength="800" placeholder="" enterkeyhint="send" />
          <button type="submit" class="send">Gönder</button>
        </form>
      </aside>
    </div>
    <div class="call-bar">
      <button type="button" id="muteBtn" class="round" aria-pressed="true">Ses</button>
      <button type="button" id="camBtn" class="round" aria-pressed="true">Kamera</button>
      <button type="button" id="panelBtn" class="round" aria-pressed="false">Panel</button>
      <button type="button" id="endBtn" class="round end">Bitir</button>
    </div>
  </main>
  <script src="/static/orb.js?v=46"></script>
  <script src="/static/app.js?v=46"></script>
</body>
</html>
